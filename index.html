<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c203c"><title>TVCalendar · Family Hub</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(120deg,#08182d,#173c61 70%,#51476c);color:#f4f8ff;font:16px system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;border-radius:10px;background:#29486c;color:white;padding:10px 14px;cursor:pointer}.primary{background:#117ff1}.muted{color:#b6c6d9}.hide{display:none!important}header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#06172cbb}h1{margin:0;font-size:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:23% 1fr 23%;gap:14px;padding:14px}.panel{border:1px solid #ffffff23;border-radius:17px;background:#081b32df;padding:18px;min-width:0}.stack{display:grid;align-content:start;gap:14px}.clock{font-size:clamp(35px,4vw,76px);font-weight:750}.monthHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;padding:10px 0;color:#a9c0d8}.day{background:#ffffff0c;border:1px solid #ffffff1d;border-radius:8px;min-height:clamp(85px,12vh,160px);padding:6px;text-align:left;overflow:hidden}.day.selected{background:#2c62945a}.day.today{outline:2px solid #52a9ff}.day strong{display:block;margin-bottom:7px}.pill{display:block;border-radius:5px;padding:4px 5px;margin:3px 0;color:#101e2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,.9vw,15px)}.item{border-bottom:1px solid #ffffff24;padding:11px 0;cursor:pointer}.item b{display:block}.item small{color:#a9c0d8}.legend{display:flex;gap:9px;align-items:center;margin:12px 0}.dot{height:11px;width:11px;border-radius:50%;display:inline-block}dialog{width:min(450px,94vw);background:#102843;border:1px solid #45607a;border-radius:17px;color:white;padding:22px}dialog::backdrop{background:#000b}label{display:block;margin:13px 0}input,select{display:block;width:100%;background:#091b31;border:1px solid #7189a2;border-radius:9px;padding:12px;color:white;margin-top:6px}.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.status{font-size:12px;color:#b9d0e9}.tv .edit{display:none!important}@media(max-width:1100px){.layout{grid-template-columns:1fr 1fr}.calendar{grid-column:1/-1;grid-row:1}}@media(max-width:650px){.layout{grid-template-columns:1fr}.calendar{grid-column:auto;grid-row:auto}.day{min-height:72px;padding:3px}.pill{font-size:9px;padding:2px}.panel{padding:12px}header{padding:12px}}@media(min-width:1600px){body{font-size:19px}.panel{padding:24px}}
</style></head><body><header><div><h1>✦ Family Calendar</h1><span id="status" class="status">Sign in to sync</span></div><div class="toolbar"><button id="back">‹</button><button id="today">Today</button><button id="forward">›</button><button class="primary edit" id="add">+ Event</button><button id="mode">TV Mode</button><button id="logout">Sign out</button></div></header><section id="login" class="panel" style="max-width:430px;margin:8vh auto"><h2>Family Sign In</h2><p class="muted">Sign in on your phone and TV with the same account.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p id="loginError" class="muted"></p></form></section><main id="app" class="layout hide"><aside class="stack"><section class="panel"><div class="clock" id="clock"></div><div class="muted" id="date"></div></section><section class="panel"><h3>Coming Up</h3><div id="upcoming"></div></section><section class="panel"><h3>Categories</h3><div id="legend"></div></section></aside><section class="panel calendar"><div class="monthHead"><h2 id="month"></h2><button id="jump">Today</button></div><div class="week"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="days" id="days"></div></section><aside class="stack"><section class="panel"><h3 id="selectedTitle"></h3><div id="agenda"></div><button class="primary edit" id="addDay">+ Add Event</button></section><section class="panel"><h3>Family Hub</h3><p class="muted">Edit events on your phone. The TV updates automatically while connected.</p></section></aside></main><dialog id="eventDialog"><form id="eventForm"><h2 id="eventHeading">New Event</h2><input type="hidden" id="eid"><label>Event<input id="title" maxlength="120" required></label><label>Date<input id="eventDate" type="date" required></label><label>Time<input id="time" type="time"></label><label>Category<select id="category"><option>Family</option><option>Work</option><option>Baseball</option><option>School</option><option>Other</option></select></label><label>Location<input id="location" maxlength="120"></label><div class="actions"><button type="button" id="remove">Delete</button><button type="button" id="cancel">Cancel</button><button class="primary">Save</button></div></form></dialog>
<script type="module">
import{firebaseConfig}from'./firebase-config.js';import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDoc}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=x=>document.getElementById(x),auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore(),colors={Family:'#fba0a4',Work:'#79baff',Baseball:'#81dba1',School:'#c8aafa',Other:'#f9d983'};let events=[],month=new Date(),selected='',coll,unsubscribe;const tv=new URLSearchParams(location.search).has('tv');if(tv)document.body.classList.add('tv');$('mode').textContent=tv?'Phone Mode':'TV Mode';$('mode').onclick=()=>location.href=tv?location.pathname:location.pathname+'?tv=1';
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');selected=iso(new Date());const from=s=>new Date(s+'T12:00:00');
function clock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('date').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}clock();setInterval(clock,15000);
const sorted=s=>events.filter(e=>e.date===s).sort((a,b)=>a.time.localeCompare(b.time));
function entry(e){let d=document.createElement('div');d.className='item';let b=document.createElement('b');b.textContent=e.title;let sm=document.createElement('small');sm.textContent=(e.time?e.time+' · ':'')+e.category+(e.location?' · '+e.location:'');d.append(b,sm);if(!tv)d.onclick=()=>edit(e);return d}
function render(){let first=new Date(month.getFullYear(),month.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());$('month').textContent=first.toLocaleDateString([],{month:'long',year:'numeric'});$('days').replaceChildren();for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),b=document.createElement('button');b.className='day'+(key===selected?' selected':'')+(key===iso(new Date())?' today':'');if(d.getMonth()!==first.getMonth())b.style.opacity='.5';let n=document.createElement('strong');n.textContent=d.getDate();b.append(n);sorted(key).slice(0,4).forEach(e=>{let p=document.createElement('span');p.className='pill';p.style.background=colors[e.category]||colors.Other;p.textContent=e.title;b.append(p)});b.onclick=()=>{selected=key;render()};$('days').append(b)}$('selectedTitle').textContent=from(selected).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});$('agenda').replaceChildren(...sorted(selected).map(entry));if(!sorted(selected).length)$('agenda').textContent='No events';let upcoming=events.filter(e=>e.date>=iso(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,7);$('upcoming').replaceChildren(...upcoming.map(e=>{let w=document.createElement('div');let sm=document.createElement('small');sm.textContent=from(e.date).toLocaleDateString([],{month:'short',day:'numeric'});w.append(sm,entry(e));return w}));if(!upcoming.length)$('upcoming').textContent='No upcoming events';$('legend').replaceChildren(...Object.entries(colors).map(([name,color])=>{let d=document.createElement('div');d.className='legend';let dot=document.createElement('span');dot.className='dot';dot.style.background=color;d.append(dot,document.createTextNode(name));return d}))}
function edit(e){$('eventHeading').textContent=e?'Edit Event':'New Event';$('eid').value=e?.id||'';$('title').value=e?.title||'';$('eventDate').value=e?.date||selected;$('time').value=e?.time||'';$('category').value=e?.category||'Family';$('location').value=e?.location||'';$('remove').classList.toggle('hide',!e);$('eventDialog').showModal()}
$('add').onclick=$('addDay').onclick=()=>edit();$('cancel').onclick=()=>$('eventDialog').close();$('eventForm').onsubmit=async ev=>{ev.preventDefault();let id=$('eid').value||crypto.randomUUID(),data={title:$('title').value.trim(),date:$('eventDate').value,time:$('time').value,category:$('category').value,location:$('location').value.trim()};try{await setDoc(doc(coll,id),data);$('eventDialog').close()}catch(e){alert(e.message)}};$('remove').onclick=async()=>{if(confirm('Delete this event?')){try{await deleteDoc(doc(coll,$('eid').value));$('eventDialog').close()}catch(e){alert(e.message)}}};
$('back').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};$('forward').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};$('today').onclick=$('jump').onclick=()=>{month=new Date();selected=iso(month);render()};$('logout').onclick=()=>signOut(auth);$('loginForm').onsubmit=async ev=>{ev.preventDefault();$('loginError').textContent='Signing in…';try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('loginError').textContent=e.message}};
onAuthStateChanged(auth,async user=>{if(unsubscribe){unsubscribe();unsubscribe=null}if(!user){$('login').classList.remove('hide');$('app').classList.add('hide');$('status').textContent='Sign in to sync';return}let member=await getDoc(doc(db,'households','family','members',user.uid));if(!member.exists()){$('loginError').textContent='Account not added to household. Add your UID in Firestore members.';$('login').classList.remove('hide');$('app').classList.add('hide');return}$('login').classList.add('hide');$('app').classList.remove('hide');coll=collection(db,'households','family','events');$('status').textContent='Connecting…';unsubscribe=onSnapshot(coll,s=>{events=s.docs.map(d=>({id:d.id,...d.data()}));$('status').textContent='● Live synced';render()},e=>{$('status').textContent='Sync error: '+e.message})});
</script></body></html>
